<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Multiple Image Upload</title>
    <style>
        /* इमेजिस के प्रिव्यू के लिए स्टाइलिंग */
        #previewContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .preview-box {
            position: relative;
            width: 100px;
            height: 100px;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
            border: 2px solid #ddd;
        }
    </style>
</head>
<body>

    <h2>एडमिन पैनल - एक से ज्यादा फोटो अपलोड करें</h2>

    <!-- 1. HTML इनपुट (multiple जोड़ा गया है) -->
    <input type="file" id="imageInput" accept="image/*" multiple>
    <br><br>

    <!-- यहाँ सभी चुनी हुई फोटो का प्रिव्यू दिखेगा -->
    <div id="previewContainer"></div>
    <br>

    <button id="saveBtn">सभी इमेजिस Firebase में सेव करें</button>

    <!-- 2. JavaScript कोड -->
    <script>
        // इस ऐरे (Array) में सभी कंप्रेस की गई फोटो का Base64 कोड जमा होगा
        let compressedImagesArray = [];

        document.getElementById('imageInput').addEventListener('change', async function (event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            compressedImagesArray = []; // पिछला डेटा साफ़ करें
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = ''; // प्रिव्यू बॉक्स साफ़ करें

            // एक-एक करके सभी चुनी हुई फोटो को कंप्रेस करें
            for (let file of files) {
                const compressedBase64 = await compressImage(file);
                compressedImagesArray.push(compressedBase64);

                // स्क्रीन पर प्रीव्यू दिखाएं
                const box = document.createElement('div');
                box.className = 'preview-box';
                box.innerHTML = `<img src="${compressedBase64}" alt="Preview">`;
                previewContainer.appendChild(box);
            }

            alert(`${compressedImagesArray.length} फोटो कम्प्रैस हो चुकी हैं! अब 'सेव करें' बटन दबाएं।`);
        });

        // फोटो को कंप्रेस (Compress) करने वाला फंक्शन
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);

                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;

                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        // 70% क्वालिटी में कम साइज़ (100KB से कम) की छवि
                        const compressedData = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(compressedData);
                    };
                };
            });
        }

        // Firebase में सेव करने वाला बटन
        document.getElementById('saveBtn').addEventListener('click', function() {
            if (compressedImagesArray.length === 0) {
                alert("कृपया पहले कम से कम एक फोटो चुनें!");
                return;
            }

            // 'compressedImagesArray' में आपकी सभी कंप्रेस फोटो का ऐरे मौजूद है
            console.log("Firebase में भेजने के लिए इमेजिस का ऐरे:", compressedImagesArray);

            // Firebase में सेव करने का उदाहरण code:
            /*
            database.ref('gallery/').set(compressedImagesArray).then(() => {
                alert("सभी इमेजिस डेटाबेस में सेव हो गईं!");
            });
            */
        });
    </script>

</body>
</html>
